AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Simple AWSapp infrastructure using CloudFormation.
  Creates ECR, RDS PostgreSQL, ECS Fargate, ALB,
  security groups and CloudWatch logging.

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0d78bf08f787b2939
    Description: Existing Default VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-07223259a0ebdc536
    Description: First public subnet

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0bd007c40b0ce5d83
    Description: Second public subnet

  RDSSubnet1:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0087990a7adf8430b
    Description: First private RDS subnet

  RDSSubnet2:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0d758401b32f2d2a8
    Description: Second private RDS subnet

  TaskCpu:
    Type: String
    Default: '256'
    AllowedValues:
      - '256'
      - '512'
      - '1024'
    Description: ECS task CPU units

  TaskMemory:
    Type: String
    Default: '512'
    AllowedValues:
      - '512'
      - '1024'
      - '2048'
    Description: ECS task memory in MiB

  RDSInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class

  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 2
    Description: Number of ECS tasks

  DBUsername:
    Type: String
    Default: postgres
    Description: PostgreSQL username

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: PostgreSQL password

Resources:

  # --------------------------------------------------
  # ECR
  # --------------------------------------------------

  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: awsapp-cfn

  # --------------------------------------------------
  # RDS
  # --------------------------------------------------

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnet group for AWSapp PostgreSQL
      SubnetIds:
        - !Ref RDSSubnet1
        - !Ref RDSSubnet2

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for AWSapp PostgreSQL
      VpcId: !Ref VpcId

  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: awsapp-cfn-rds
      Engine: postgres
      DBInstanceClass: !Ref RDSInstanceClass
      AllocatedStorage: 20
      StorageType: gp2
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: AWSappDb
      Port: 5432
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !GetAtt RDSSecurityGroup.GroupId
      DeletionProtection: false

  # --------------------------------------------------
  # ECS
  # --------------------------------------------------

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: awsapp-cfn-cluster

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: awsapp-cfn-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ecs/awsapp-cfn
      RetentionInDays: 1

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for AWSapp ECS tasks
      VpcId: !Ref VpcId

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for AWSapp ALB
      VpcId: !Ref VpcId

  # ALB allows HTTP from Internet
  ALBIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  # ECS only accepts traffic from ALB
  ECSIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ECSSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref ALBSecurityGroup

  # RDS only accepts traffic from ECS
  RDSIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ECSSecurityGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: awsapp-cfn-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn

      ContainerDefinitions:
        - Name: awsapp
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/awsapp-cfn:latest'
          Essential: true

          PortMappings:
            - ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp

          Environment:
            - Name: ConnectionStrings__DefaultConnection
              Value: !Sub
                - 'Host=${DBHost};Port=5432;Database=AWSappDb;Username=${DBUser};Password=${DBPass}'
                - DBHost: !GetAtt RDSInstance.Endpoint.Address
                  DBUser: !Ref DBUsername
                  DBPass: !Ref DBPassword

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /aws/ecs/awsapp-cfn
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # --------------------------------------------------
  # ALB
  # --------------------------------------------------

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: awsapp-cfn-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: awsapp-cfn-tg
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPort: '8080'
      HealthCheckPath: /

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --------------------------------------------------
  # ECS Service
  # --------------------------------------------------

  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListener
    Properties:
      ServiceName: awsapp-cfn-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2

      LoadBalancers:
        - ContainerName: awsapp
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:

  ECRRepositoryUri:
    Description: ECR repository URI
    Value: !GetAtt ECRRepository.RepositoryUri

  ECSClusterName:
    Description: ECS cluster
    Value: !Ref ECSCluster

  ECSServiceName:
    Description: ECS service
    Value: !GetAtt ECSService.Name

  RDSInstanceEndpoint:
    Description: PostgreSQL endpoint
    Value: !GetAtt RDSInstance.Endpoint.Address

  LoadBalancerURL:
    Description: Application Load Balancer URL
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  CloudWatchLogGroup:
    Description: ECS CloudWatch log group
    Value: /aws/ecs/awsapp-cfn